<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Last Light: Swarmfall app mark.

    One idea, readable at 48px: a katana mid-cut, with the streak of the cut
    sweeping behind it. The mark this replaced was a thin outlined pentagon with
    small floating dots - exactly the kind of detail that dissolves into mush at
    launcher size.

    Two construction rules keep it legible small:
      * the sword is laid out along a single axis (65 degrees above horizontal)
        so blade, guard, grip and pommel line up as one object;
      * the streak is a tapered ribbon, not a circular crescent. A crescent at
        this size reads as a moon, which is a different game entirely.
  -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="streak" x1="0.05" y1="0.7" x2="0.95" y2="0.3">
      <stop offset="0" stop-color="#1fb9e0" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#66ecff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="steel" x1="0.1" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#8093b4"/>
      <stop offset="0.45" stop-color="#dde7fa"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#field)"/>

  <!-- Sector grid, matching the in-game backdrop. Very low contrast: it is
       texture, not detail that has to survive downscaling. -->
  <g stroke="#2d5f86" stroke-opacity="0.18" stroke-width="3">
    <path d="M128 0V512M256 0V512M384 0V512M0 128H512M0 256H512M0 384H512"/>
  </g>

  <!-- The cut: wide where the sweep began, tapering to a point, and crossing
       the blade at a clearly different angle. Run parallel to the blade it just
       reads as a second sword. -->
  <path d="M-24 268 Q223 167 452 150 Q239 204 20 356 Z" fill="url(#streak)"/>

  <!-- Blade. Both edges curve the same way and by the same amount, which is
       what makes it read as a katana rather than a straight sword. -->
  <path d="M194 320 Q259 172 364 42 L372 46 Q285 184 238 340 Z" fill="url(#steel)"/>
  <!-- Bright cutting edge, inset so it stops at the point instead of
       overshooting it into a cross. -->
  <path d="M232 337 Q278 181 365 43" fill="none" stroke="#ffffff"
        stroke-opacity="0.92" stroke-width="10" stroke-linecap="round"/>

  <!-- Tsuba, grip and pommel, all on the same axis as the blade. -->
  <path d="M170 316 L258 357 L268 336 L180 296 Z" fill="#ffb648"/>
  <path d="M206 326 L224 334 L188 410 L170 402 Z" fill="#c8801f"/>
  <g stroke="#f8d493" stroke-width="7" stroke-linecap="round">
    <path d="M200 344 L217 352M191 366 L208 374"/>
  </g>
  <circle cx="179" cy="406" r="19" fill="#ffb648"/>
</svg>
